<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>会議コスト計算機</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1d2330;
      --muted: #6b7280;
      --border: #d9dde3;
      --accent: #2563eb;
      --result-bg: #eef3ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151b;
        --card: #1b2029;
        --text: #e8ebf0;
        --muted: #9aa3b2;
        --border: #2e3542;
        --accent: #7aa2ff;
        --result-bg: #1f2a44;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    main {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.lead { margin: 0 0 24px; color: var(--muted); font-size: 0.9rem; }
    label { display: block; font-size: 0.9rem; margin-bottom: 6px; }
    .field { margin-bottom: 18px; }
    .input-row { display: flex; align-items: center; gap: 8px; }
    input {
      flex: 1;
      width: 100%;
      font-size: 1.1rem;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .unit { color: var(--muted); min-width: 3em; }
    .result {
      margin-top: 8px;
      padding: 18px;
      border-radius: 10px;
      background: var(--result-bg);
      text-align: center;
    }
    .result .label { font-size: 0.85rem; color: var(--muted); }
    .result .total {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }
    .result .detail { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>会議コスト計算機</h1>
    <p class="lead">その会議、いくらかかっているか計算します。</p>

    <div class="field">
      <label for="people">参加人数</label>
      <div class="input-row">
        <input id="people" type="number" min="0" step="1" value="5" inputmode="numeric">
        <span class="unit">人</span>
      </div>
    </div>

    <div class="field">
      <label for="hours">会議時間</label>
      <div class="input-row">
        <input id="hours" type="number" min="0" step="0.25" value="1" inputmode="decimal">
        <span class="unit">時間</span>
      </div>
    </div>

    <div class="field">
      <label for="rate">1時間あたりの単価（1人）</label>
      <div class="input-row">
        <input id="rate" type="number" min="0" step="100" value="3000" inputmode="numeric">
        <span class="unit">円</span>
      </div>
    </div>

    <div class="result" aria-live="polite">
      <div class="label">合計コスト</div>
      <div class="total" id="total">¥0</div>
      <div class="detail" id="detail"></div>
    </div>
  </main>

  <script>
    const people = document.getElementById('people');
    const hours = document.getElementById('hours');
    const rate = document.getElementById('rate');
    const total = document.getElementById('total');
    const detail = document.getElementById('detail');
    const yen = new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', maximumFractionDigits: 0 });

    function value(input) {
      const n = parseFloat(input.value);
      return Number.isFinite(n) && n > 0 ? n : 0;
    }

    function update() {
      const p = value(people), h = value(hours), r = value(rate);
      total.textContent = yen.format(Math.round(p * h * r));
      detail.textContent = `${p}人 × ${h}時間 × ${yen.format(r)}`;
    }

    [people, hours, rate].forEach(el => el.addEventListener('input', update));
    update();
  </script>
</body>
</html>
